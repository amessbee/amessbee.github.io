papers:

- title: "On the Enumeration of Generalized Cospectral Mates of Graphs"
  authors: "Muhammad Raza, Obaid Ullah Ahmad, Mudassir Shabbir, Waseem Abbas"
  venue: "arXiv:2601.07373 (2026)"
  year: 2026
  paper_url: https://arxiv.org/abs/2601.07373
  abstract: "Establishes tight asymptotic bounds on the number of generalized cospectral mates of graphs via a combinatorial enumeration method based on the Smith Normal Form of the walk matrix — yielding an explicit count for a broad family of graphs."
  selected: y

- title: "Controllability Backbone in Multiagent Networks"
  authors: "Mudassir Shabbir, Waseem Abbas"
  venue: "Automatica (2026)"
  year: 2026
  paper_url: https://www.sciencedirect.com/science/article/pii/S0005109826003225
  abstract: "Identifies a minimal controllability-preserving subgraph — the backbone — in multiagent networks with distributed linear dynamics. Backbone structure is characterized via zero forcing, with polynomial-time algorithms for extraction and edge augmentation."
  selected: y

- title: "Walk Matrix-Based Upper Bounds on Generalized Cospectral Mates"
  authors: "Muhammad Raza, Mudassir Shabbir, Waseem Abbas"
  venue: "arXiv:2507.06927 (2025)"
  year: 2025
  paper_url: https://arxiv.org/abs/2507.06927
  abstract: "Upper bounds on the number of non-isomorphic generalized cospectral mates derived from arithmetic properties of the walk matrix determinant, applicable to the broad family ℋₙ."
  selected: y

- title: "Learning Backbones: Sparsifying Graphs through Zero Forcing for Effective Graph-Based Learning"
  authors: "Obaid Ullah Ahmad, Anwar Said, Mudassir Shabbir, Xenofon Koutsoukos, Waseem Abbas"
  venue: "arXiv:2502.17713 (2025)"
  year: 2025
  paper_url: https://arxiv.org/abs/2502.17713
  abstract: "A graph sparsification approach using zero forcing sets to extract learning-effective backbones from dense graphs, improving GNN performance and scalability while preserving structural properties relevant to downstream tasks."
  selected: y

- title: "Feature Construction Using Network Control Theory and Rank Encoding for Graph Machine Learning"
  authors: "Anwar Said, Yingbo Wei, Obaid Ullah Ahmad, Mudassir Shabbir, Waseem Abbas, Xenofon Koutsoukos"
  venue: "IEEE Open Journal of Control Systems (2025)"
  year: 2025
  paper_url: ""
  abstract: "A network control-theoretic feature construction method using rank encoding of controllability Gramians, producing expressive node features that outperform spectral and positional baselines on multiple benchmarks."
  selected: y

- title: "Control-based Conditions for Graph Distinguishability"
  authors: "Muhammad Raza, Obaid Ullah Ahmad, Mudassir Shabbir, Xenofon Koutsoukos, Waseem Abbas"
  venue: "Proc. Conference on Control and its Applications (CT), SIAM, pp. 31–38 (2025)"
  year: 2025
  paper_url: ""
  abstract: "Arithmetic conditions on the walk matrix characterizing when a graph is determined by its generalized spectrum, with applications to the graph distinguishability problem."
  selected: y

- title: "Resilient Distributed Learning in Multi-UAV Systems"
  authors: "Nathan Potteiger, Mudassir Shabbir, Scott Eisele, Markus Wutka, Xenofon Koutsoukos"
